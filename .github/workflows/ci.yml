name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[test,rich,excel]"
      - name: Compile
        run: python -m compileall -q mlfox tests examples
      - name: Test suite
        run: python -m pytest -vv
      - name: Integration runner
        run: python -m mlfox.test
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Verify wheel installation in a clean environment
        run: |
          python -m venv .venv-wheel-check
          . .venv-wheel-check/bin/activate
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          from mlfox import load_model, mlfox
          assert callable(mlfox) and callable(load_model)
          from sklearn.datasets import make_regression
          import pandas as pd
          X, y = make_regression(n_samples=48, n_features=3, random_state=41)
          data = pd.DataFrame(X, columns=["a", "b", "c"])
          data["target"] = y
          model = mlfox(task="regression", cv=2, progress=False).fit(data, "target")
          assert len(model.predict(data.drop(columns="target").head())) == 5
          from sklearn.datasets import make_classification
          Xc, yc = make_classification(n_samples=48, n_features=4, n_informative=3,
                                       n_redundant=0, random_state=42)
          cls_data = pd.DataFrame(Xc, columns=["a", "b", "c", "d"])
          cls_data["target"] = yc
          classifier = mlfox(task="binary_classification", cv=2, progress=False).fit(cls_data, "target")
          assert len(classifier.predict(cls_data.drop(columns="target").head())) == 5
          PY
