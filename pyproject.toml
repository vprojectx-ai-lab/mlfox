[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlfox"
version = "1.0.4"
description = "CPU-only MLFOX model selection, evaluation, explainability, and inference toolkit"
authors = [{name = "vprojectx"}]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["machine-learning", "automl", "tabular", "scikit-learn", "xgboost", "classification", "regression"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    # Minimal CPU package on Windows/Linux, standard CPU XGBoost on macOS.
    "xgboost-cpu>=3.1.3,<3.2; sys_platform == 'win32' or sys_platform == 'linux'",
    "xgboost>=3.1.3,<3.2; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/viraj-salunke/Vprojectx"
Repository = "https://github.com/viraj-salunke/Vprojectx"
Issues = "https://github.com/viraj-salunke/Vprojectx/issues"
Changelog = "https://github.com/viraj-salunke/Vprojectx/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]
rich = ["rich>=13"]
excel = ["openpyxl>=3.1", "xlrd>=2.0"]

[tool.setuptools.packages.find]
include = ["mlfox*"]

[tool.setuptools.package-data]
mlfox = ["py.typed", "templates/*"]   # remove or adjust if you have no such files

[tool.pytest.ini_options]
testpaths = ["tests"]